{% extends "base.html" %}
{% block title %}Novo curso | Gestão Escolar{% endblock %}
{% block content %}
<section class="card auth" style="width:min(650px,100%)"><h1>Adicionar curso</h1><p class="muted">Inclua as matérias para elas aparecerem no lançamento de notas.</p>
<form method="post">
  <label for="nome">Nome do curso</label><input id="nome" name="nome" placeholder="Ex.: Ensino Fundamental — 3º Ano" required>
  <label for="descricao">Descrição</label><textarea id="descricao" name="descricao" rows="3"></textarea>
  <div class="grade"><div><label for="duracao_meses">Duração em meses</label><input id="duracao_meses" name="duracao_meses" type="number" min="1"></div><div><label for="valor">Valor mensal (opcional)</label><input id="valor" name="valor" type="number" min="0" step="0.01"></div></div>
  <label for="disciplinas">Matérias</label><textarea id="disciplinas" name="disciplinas" rows="4" placeholder="Português&#10;Matemática&#10;Ciências"></textarea>
  <button type="submit">Salvar curso</button><a class="botao secundario" href="/cursos">Cancelar</a>
</form></section>
{% endblock %}
