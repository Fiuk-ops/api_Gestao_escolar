{% extends "base.html" %}
{% block title %}Novo professor | Gestão Escolar{% endblock %}
{% block content %}
<section class="card auth" style="width:min(620px,100%)">
  <h1>Adicionar professor</h1>
  <p class="muted">O professor poderá entrar com o e-mail e a senha informados.</p>
  <form method="post">
    <label for="nome">Nome completo</label><input id="nome" name="nome" required>
    <label for="email">E-mail</label><input id="email" name="email" type="email" required>
    <label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" required>
    <label for="formacao">Formação</label><input id="formacao" name="formacao" placeholder="Ex.: Licenciatura em Matemática">
    <label for="especialidade">Especialidade</label><input id="especialidade" name="especialidade" placeholder="Ex.: Matemática">
    <label for="senha">Senha de acesso</label><input id="senha" name="senha" type="password" autocomplete="new-password" required>
    <button type="submit">Salvar professor</button><a class="botao secundario" href="/professores">Cancelar</a>
  </form>
</section>
{% endblock %}
