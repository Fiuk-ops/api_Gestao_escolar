{% extends "base.html" %}
{% block title %}Cadastro | Gestão Escolar{% endblock %}
{% block content %}
<section class="card auth">
  <h1>Cadastro de aluno</h1>
  <p class="muted">Preencha os seus dados para criar o acesso.</p>
  <form method="post" action="{{ url_for('cadastro') }}">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" required>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required>
    <label for="cpf">CPF</label>
    <input id="cpf" name="cpf" inputmode="numeric" required>
    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" type="tel">
    <label for="data_nascimento">Data de nascimento</label>
    <input id="data_nascimento" name="data_nascimento" type="date">
    <label for="senha">Crie uma senha</label>
    <input id="senha" name="senha" type="password" autocomplete="new-password" required>
    <button type="submit">Criar cadastro</button>
  </form>
  <p class="muted"><a href="/login">Voltar para o login</a></p>
</section>
{% endblock %}
